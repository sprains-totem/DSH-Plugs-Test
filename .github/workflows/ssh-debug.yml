name: "Interactive SSH and Reliability Test"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      refresh_token:
        description: "Antigravity OAuth Refresh Token"
        required: false
        type: string
      auto_start_dsh:
        description: "Auto-start DSH Server in background"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  interactive-ssh:
    name: "Interactive SSH Runner (Tmate)"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout DSH-Plugs-Test
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install System Tools & Dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl wget jq tmate psmisc
          curl -L -s --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb
          sudo npm install -g @deepseek-ai/dsh
          sudo chown -R $(whoami) /usr/local/lib/node_modules

      - name: Setup Plugins & Environment
        run: |
          echo "Cloning plugin repositories..."
          git clone https://github.com/sprains-totem/dsh-Antigravity-Provider.git repo-antigravity
          git clone https://github.com/sprains-totem/dsh-CloudFlare-Tunnel.git repo-cloudflare-tunnel

          mkdir -p ~/.dsh/profiles/web/plugins ~/.dsh/profiles/web/node_modules

          # 1. 部署 Antigravity 插件
          cp -r repo-antigravity/dsh-llm-antigravity ~/.dsh/profiles/web/plugins/
          cp -r repo-antigravity/dsh-web-search-antigravity ~/.dsh/profiles/web/plugins/
          cp -r repo-antigravity/dsh-web-search-selector ~/.dsh/profiles/web/plugins/
          cp -r repo-antigravity/dsh-image-gen-antigravity ~/.dsh/profiles/web/plugins/

          # 2. 部署 Cloudflare Tunnel 插件
          cp -r repo-cloudflare-tunnel ~/.dsh/profiles/web/plugins/dsh-cloudflare-tunnel

          # 3. 部署到 node_modules
          cp -r ~/.dsh/profiles/web/plugins/* ~/.dsh/profiles/web/node_modules/

          # 4. 配置 cordis.patch.yml (组合套件)
          cp cordis.combined.yml ~/.dsh/profiles/web/cordis.patch.yml
          rm -f ~/.dsh/cordis.patch.yml

          # 5. 执行深度解禁
          if [ -f "repo-antigravity/unlock-dsh.mjs" ]; then
            node repo-antigravity/unlock-dsh.mjs
          fi

          # 6. 配置凭据
          REFRESH_TOKEN="${{ inputs.refresh_token || secrets.ANTIGRAVITY_REFRESH_TOKEN || '1//mock_token_for_ui_verification' }}"
          mkdir -p ~/.dsh
          echo "ANTIGRAVITY_REFRESH_TOKEN: \"$REFRESH_TOKEN\"" > ~/.dsh/.credentials.yaml
          echo "Configured ANTIGRAVITY_REFRESH_TOKEN credential."

      - name: Start DSH Server in Background
        if: ${{ inputs.auto_start_dsh != false }}
        run: |
          echo "Starting DSH Web Server on port 3080..."
          dsh web --port 3080 --no-open > /tmp/dsh-combined.log 2>&1 &
          DSH_PID=$!
          echo "DSH_PID=$DSH_PID" >> $GITHUB_ENV
          
          echo "Waiting for DSH port 3080..."
          for i in $(seq 1 40); do
            if curl -s http://127.0.0.1:3080/ | grep -q "DOCTYPE html"; then
              echo "✅ DSH Server started on port 3080 (HTTP 200)!"
              break
            fi
            sleep 1
          done

      - name: Launch Tmate SSH & Interactive Session
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN || secrets.CLOUDFLARE_WORKER_API }}
        run: |
          echo "=========================================================="
          echo "🚀 正在启动 Tmate 远程终端共享 (SSH / Web Shell)..."
          echo "=========================================================="

          # 保证 SSH 密钥存在
          if [ ! -f "$HOME/.ssh/id_rsa" ] && [ ! -f "$HOME/.ssh/id_ed25519" ]; then
            mkdir -p "$HOME/.ssh"
            ssh-keygen -t ed25519 -f "$HOME/.ssh/id_ed25519" -N "" -q 2>/dev/null || ssh-keygen -t rsa -f "$HOME/.ssh/id_rsa" -N "" -q 2>/dev/null || true
          fi

          rm -f /tmp/tmate.sock
          tmate -S /tmp/tmate.sock new-session -d || true
          timeout 30s tmate -S /tmp/tmate.sock wait tmate-ready || true

          TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || echo "")
          TMATE_WEB=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}' 2>/dev/null || echo "")

          echo "=========================================================="
          echo "🔑 Tmate SSH: $TMATE_SSH"
          echo "🌐 Tmate Web: $TMATE_WEB"
          echo "=========================================================="

          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "## 🔑 Tmate 交互式调试终端 (SSH & Web Shell)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **SSH 快速连接**: \`$TMATE_SSH\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Web 网页终端**: [$TMATE_WEB]($TMATE_WEB)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 🛠️ 常用测试命令：" >> "$GITHUB_STEP_SUMMARY"
            echo "- 检查 DSH: \`curl -I http://127.0.0.1:3080/\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 查看日志: \`tail -f /tmp/dsh-combined.log\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 运行 Chrome 测试: \`TEST_MODE=combined TARGET_URL=http://127.0.0.1:3080/ HEADLESS=true OUTPUT_DIR=./screenshots/combined node test/chrome-cdp-test.mjs\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 结束会话: \`touch /tmp/continue\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          tmate -S /tmp/tmate.sock send-keys "echo '=== 欢迎进入 DSH-Plugs-Test 调试终端 ==='" C-m
          tmate -S /tmp/tmate.sock send-keys "echo '运行测试: node test/chrome-cdp-test.mjs'" C-m
          tmate -S /tmp/tmate.sock send-keys "echo '查看日志: tail -f /tmp/dsh-combined.log'" C-m
          tmate -S /tmp/tmate.sock send-keys "echo '退出结束: touch /tmp/continue'" C-m

          while [ ! -f /tmp/continue ] && pgrep -x tmate >/dev/null; do
            sleep 10
          done

          echo "会话已结束 (检测到 /tmp/continue 或 Tmate 进程退出)。"
